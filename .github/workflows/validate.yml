name: Validate data

on:
  pull_request:
    paths: ["data/**", "scripts/**", "state/**"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "state/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
